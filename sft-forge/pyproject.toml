[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sft-forge"
version = "0.1.0"
description = "A resumable, provider-agnostic workflow for generating high-quality SFT training data for LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harsha (FALCON5816-CODER)" }]
keywords = ["llm", "sft", "synthetic-data", "fine-tuning", "dataset-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
hub = ["datasets>=2.18", "huggingface_hub>=0.22"]

[project.scripts]
sft-forge = "sft_forge.cli:main"

[project.urls]
Homepage = "https://github.com/FALCON5816-CODER/FALCON5816-CODER"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
